name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  guard-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine-free projects must not reference Godot (ADR 0002)
        shell: bash
        run: |
          # Match real references (using directives, the GodotSharp package, the Godot SDK),
          # not the word "Godot" in prose comments.
          pattern='using[[:space:]]+Godot|GodotSharp|Godot\.NET\.Sdk'
          for p in src/Core src/Ai src/Content src/Save src/Camera src/Runner; do
            if grep -rnE "$pattern" "$p" --include="*.cs" --include="*.csproj"; then
              echo "::error::Godot reference found in $p"
              exit 1
            fi
          done

  core:
    needs: guard-core
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Project-NightCero.sln
      - name: Format check
        run: dotnet format Project-NightCero.sln --verify-no-changes --no-restore
      - name: Test
        run: dotnet test Project-NightCero.sln --no-restore --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Read the root line-rate without piping into head: with `-o pipefail`, grep dies of
          # SIGPIPE as soon as head exits, and the step fails once the report is large enough.
          file=$(find coverage -name 'coverage.cobertura.xml' -print -quit)
          if [ -z "$file" ]; then
            echo "::warning::no coverage file found"
            exit 0
          fi
          content=$(<"$file")
          if [[ $content =~ line-rate=\"([0-9.]+)\" ]]; then
            rate=${BASH_REMATCH[1]}
          else
            echo "::warning::no line-rate attribute in $file"
            exit 0
          fi
          pct=$(awk "BEGIN { printf \"%.1f\", $rate * 100 }")
          echo "Line coverage: **$pct%**" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
